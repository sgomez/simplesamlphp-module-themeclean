<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secret and copy fields</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./console.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="ui {{theme}}" style="width: 720px; min-height: 460px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 20px; background: var(--bg)"><h1 class="h2">Secret and copy fields</h1><div style="display: flex; flex-direction: column; gap: 14px; min-width: 0"><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Masked</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input mono" type="password" value="correct-horse" aria-label="Secret" style="flex: 1 1 200px"><button class="btn btn-secondary" type="button">Reveal</button></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Revealed</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input mono" type="text" value="correct-horse" aria-label="Secret" style="flex: 1 1 200px"><button class="btn btn-secondary" type="button">Hide</button></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Secret reference</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input mono" type="text" value="%secret(ldap_bind)%" aria-label="Secret reference" style="flex: 1 1 200px"><span class="chip">Secret reference</span></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">In a diff</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><div class="diff" style="flex: 1 1 200px"><div class="dl dl-sec"><span class="ds">~</span><span>'privatekey_pass'  secret changed, value not shown</span></div></div></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Copy</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input mono" type="text" readonly value="https://login.example.edu/sp" aria-label="Entity ID" style="flex: 1 1 200px"><button class="btn btn-secondary" type="button">Copy</button></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Copied</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input mono" type="text" readonly value="https://login.example.edu/sp" aria-label="Entity ID" style="flex: 1 1 200px"><button class="btn btn-secondary" type="button">Copied</button></div></div></div><p class="xs faint" style="margin: 0; max-width: 72ch">A reference is plain text because it is not the secret. A literal is never shown outside its own field.</p></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":720,"height":460}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
