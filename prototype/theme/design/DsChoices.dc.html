="display: flex; flex-direction: column; gap: 8px; min-width: 0"><label style="display: flex; align-items: center; gap: 10px"><input class="check" type="radio" name="r" defaultChecked="{{ true }}"><span>HTTP-POST</span></label><label style="display: flex; align-items: center; gap: 10px"><input class="check" type="radio" name="r"><span>HTTP-Redirect</span></label><label style="display: flex; align-items: center; gap: 10px"><input class="check" type="radio" name="r"><span>HTTP-Artifact</span></label></div></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Segmented</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><nav class="seg" aria-label="Example"><a class="on" href="#" aria-current="true">All <span class="faint" style="font-weight: 400">42</span></a><a href="#">Not live <span class="faint">3</span></a><a class="is-focus" href="#">Focus</a></nav></div></div></div><p class="xs faint" style="margin: 0; max-width: 72ch">A switch always carries the word On or Off. Closed sets are selects or radios, never free text.</p></div>
