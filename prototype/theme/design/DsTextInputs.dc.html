<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text inputs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./console.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="ui {{theme}}" style="width: 720px; min-height: 760px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 20px; background: var(--bg)"><h1 class="h2">Text inputs</h1><div style="display: flex; flex-direction: column; gap: 14px; min-width: 0"><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Default</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input " type="text" value="" placeholder="Placeholder" aria-label="Example" style="flex: 1 1 200px"></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Hover</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input is-hover" type="text" value="Text" placeholder="" aria-label="Example" style="flex: 1 1 200px"></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Focus</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input is-focus" type="text" value="Text" placeholder="" aria-label="Example" style="flex: 1 1 200px"></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Monospace</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input mono" type="text" value="https://example.edu/sp" placeholder="" aria-label="Example" style="flex: 1 1 200px"></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Number</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input mono" type="number" value="3600" placeholder="" aria-label="Example" style="flex: 1 1 200px"></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Disabled</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input " type="text" value="Read from the file" placeholder="" aria-label="Example" style="flex: 1 1 200px" disabled></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Error</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px; min-width: 0"><div><input class="input mono is-error" type="text" value="disco.example.edu/ds" placeholder="" aria-label="Example" style="flex: 1 1 200px"></div><div><div class="msg-error"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="flex: none; margin-top: 2px"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm-.9 3.5h1.8v5H7.1v-5zm0 6.2h1.8v1.8H7.1v-1.8z"></path></svg><span>Enter the full URL, starting with https://</span></div></div></div></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Warning</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px; min-width: 0"><div><input class="input mono" type="text" value="http://app.example.edu/acs" placeholder="" aria-label="Example" style="flex: 1 1 200px"></div><div><div class="msg-warning"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="flex: none; margin-top: 2px"><path d="M8 1.2 15.2 14H.8L8 1.2zm-.9 4.6v4h1.8v-4H7.1zm0 5.2v1.7h1.8V11H7.1z"></path></svg><span>Plain http endpoint.</span></div></div></div></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Search</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><input class="input " type="search" value="" placeholder="Search by name or entity ID" aria-label="Example" style="flex: 1 1 200px"></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Select</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><select class="input" aria-label="Example" style="flex: 1 1 200px"><option>persistent</option><option>transient</option></select></div></div><div style="display: flex; align-items: center; gap: 16px"><span class="xs muted" style="flex: 0 0 96px">Textarea</span><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-width: 0"><textarea class="input" rows="3" aria-label="Example" style="flex: 1 1 200px">Longer text</textarea></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":720,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
